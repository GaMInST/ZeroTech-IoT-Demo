apply plugin: 'com.android.application'
apply plugin: 'dagger.hilt.android.plugin'

android {
    namespace 'com.zerotechiot.eg'
    compileSdk 34

    defaultConfig {
        applicationId rootProject.ext.applicationId
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 2
        versionName "1.1.0"
        multiDexEnabled true

        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        manifestPlaceholders = [
                TUYA_SMART_APPKEY           : "${properties.getProperty("appKey")}",
                TUYA_SMART_SECRET           : "${properties.getProperty("appSecret")}",
                APP_SCHEME_NAME             : "${properties.getProperty("app_scheme")}",
                INTERNAL_HOST               : "${properties.getProperty("app_scheme")}".concat('.app.tuya.com'),
                ALEXA_AUTH_INTERNAL_HOST    : "${properties.getProperty("app_scheme")}".concat('.applink.smart321.com'),
                ALEXA_AUTH_INTERNAL_HOST_NEW: "${properties.getProperty("app_scheme")}".toLowerCase(Locale.ENGLISH).concat('.applink.smart321.com'),
                ALEXA_AUTH_INTERNAL_HOST_NEWER:"${properties.getProperty("app_scheme")}".toLowerCase(Locale.ENGLISH).concat('.applink.smart321.com'),
                PACKAGE_NAME                : "com.zerotechiot.eg"
        ]
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/*/liblog.so', 'lib/*/libc++_shared.so', 'lib/*/libyuv.so', 'lib/*/libopenh264.so', 'lib/*/libv8wrapper.so', 'lib/*/libv8android.so']
        }
        resources {
            excludes += ['AndroidManifest.xml']
        }
    }

    signingConfigs {
        custom {
            storeFile file("C:/ZeroTech Github demo/tuya-ui-bizbundle-android-demo/sha 256.jks")
            storePassword "abdo_Iot808"
            keyAlias "key0"
            keyPassword "abdo_Iot808"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.custom
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.custom
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    // Optimized dex options for better memory management
    dexOptions {
        javaMaxHeapSize "2g"
        preDexLibraries = false
        threadCount = 4
        additionalParameters += '--no-warning'
    }

    // Reduce memory usage during build

    // Optimize build performance
    buildFeatures {
        buildConfig true
        viewBinding false
        dataBinding false
    }
    androidResources {
        noCompress 'lite'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'InvalidPackage', 'MissingTranslation'
    }
}

repositories {
    google()
    mavenCentral()
    // Add Tuya's Maven repository for SDK dependencies
    maven { url 'https://maven-other.tuya.com/repository/maven-commercial-releases/' }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar","*.aar"])


    implementation project(path: ':panel')
    implementation project(path: ':mall')
    implementation project(path: ':scene')
    implementation project(path: ':ipc')
    implementation project(path: ':cloudstorage')
    implementation project(path: ':feedback')
    implementation project(path: ':message')
    implementation project(path: ':activator')
    implementation project(path: ':ota')
    implementation project(path: ':family')
    implementation project(path: ':devicedetail')
    implementation project(path: ':groupmanager')
    implementation project(path: ':location')
    implementation project(path: ':alexa_google_bind')
    implementation project(path: ':lightscene')
    implementation project(path: ':share')
    implementation project(path: ':control')
    implementation project(path: ':third_service')
    implementation project(":miniapp")
    implementation project(":marketing")

    implementation "com.thingclips.smart:thingsmart-theme-open:2.0.6"
    implementation "com.thingclips.smart:thingsmart-commonbiz-relation-api:4.5.0-rc.1"

    //demo use only start
    api "com.thingclips.smart:thingsmart:${sdk_version}"

    implementation 'com.thingclips.smart:thingsmart-demo-login:4.5.2'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Add specific version of Google Play Services
    implementation 'com.google.android.gms:play-services-location:20.0.0'

    //demo use only end

    // Test dependencies removed for production
    annotationProcessor "com.google.dagger:hilt-android-compiler:$hilt_version"
    implementation "com.google.dagger:hilt-android:$hilt_version"

    // Tuya Smart Life SDK core
    // implementation 'com.tuya.smart:thingsmart:4.5.0'
    // Device control (IThingDevice, ThingDeviceSdk, etc.)
    // implementation 'com.tuya.smart:thingpanel:4.5.0'
    // Scene management (SceneBean, etc.)
    // implementation 'com.tuya.smart:thingscene:4.5.0'
    // Only keep valid Tuya dependencies:
    implementation "com.thingclips.smart:thingsmart-theme-open:2.0.6"
    implementation "com.thingclips.smart:thingsmart-commonbiz-relation-api:4.5.0-rc.1"
    api "com.thingclips.smart:thingsmart:${sdk_version}"
    implementation 'com.thingclips.smart:thingsmart-demo-login:4.5.2'
}

apply plugin: 'com.thingclips.open.theme'

thingOpenTheme {
    // Light mode - Using dark theme colors to avoid yellow background
    lightTheme {
        color {
            // Background color - Changed from yellow to dark
            backgroundColor "#0A1929"
            // Theme color - Modern IoT blue
            themeColor "#00D4FF"
            // Warning color
            warningColor "#FF4444"
            // Tip color
            tipColor "#00CC99"
            // Guide color
            guideColor "#8B5CF6"

            // Tab selected background color
            tabBarSelectColor "#00D4FF"
            // Navigation bar background color
            navigationBarColor "#1E293B"
        }
        colorAlpha {
            // Alert mask transparency
            alertMaskAlpha 0.3
        }
    }
    // Dark mode - Using consistent dark theme
    blackTheme {
        color{
            // Background color - Dark theme
            backgroundColor "#000000"
            // Theme color - Modern IoT blue
            themeColor "#00D4FF"
            // Warning color
            warningColor "#FF4444"
            // Tip color
            tipColor "#00CC99"
            // Guide color
            guideColor "#8B5CF6"
            // Tab selected background color
            tabBarSelectColor "#00D4FF"
            // Navigation bar background color
            navigationBarColor "#1A1A1A"
        }
        colorAlpha{
            // Alert mask transparency
            alertMaskAlpha 0.8
        }
    }
}
