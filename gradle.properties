## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true

# Android configuration
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=34
android.useAndroidX=true

# Gradle performance optimizations
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000

# Build performance (only modern options)
android.enableR8.fullMode=true
android.enableBuildCache=true
android.enableJetifier=true
android.useAndroidX=true

# Memory optimizations (modern options only)
android.enableResourceOptimizations=true
android.enableBuildConfigAsBytecode=true

# Kotlin daemon settings
kotlin.daemon.jvm.options=-Xmx2048m
kotlin.incremental=false
kotlin.code.style=official
