apply plugin: 'com.android.library'

android {
    compileSdk 33
//    buildToolsVersion "33.0.1"

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Disable tests
    testOptions {
        unitTests.all {
            enabled = false
        }
    }
}

dependencies {
    api "com.thingclips.smart:thingsmart:${sdk_version}"
//    api ("com.thingclips.smart:thingsmart-bizbundle-device_activator:${bizbundle_version}")
    api enforcedPlatform("com.thingclips.smart:thingsmart-BizBundlesBom:${biz_bom_version}")
    api "com.thingclips.smart:thingsmart-bizbundle-device_activator"
    // arcode scan
//    api "com.thingclips.smart:thingsmart-bizbundle-qrcode_scankit"
    api "com.thingclips.smart:thingsmart-bizbundle-qrcode_mlkit"

    // Add test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}